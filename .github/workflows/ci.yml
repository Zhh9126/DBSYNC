name: DBDataSync CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

# Wave23 P2：限制 Maven 自身 JVM 堆。JDK8 默认按物理内存 1/4 预留堆，
# 在 CI runner / 页面文件吃紧的开发机上会因原生内存不足导致测试 fork 崩溃。
# 测试 fork 的低内存参数由父 pom 的 surefire argLine 统一提供，无需在此重复。
env:
  MAVEN_OPTS: "-Xms64m -Xmx512m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8"

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # Wave23：默认跑离线可重复单测；需要真实数据源的集成测试由 surefire excludes 剔除，
      # 可在自有机房用 -Dtest=XXX -Dsurefire.excludes=none 单独执行。
      - name: Build with Maven (tests enabled)
        run: mvn -B -f pom.xml clean verify -Dskip.spotless=true

      - name: Collect surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: warn

  consistency-suite:
    name: CDC consistency / resume / fault injection
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 离线一致性、断点续传与故障注入单测（不连真库，使用临时目录与模拟位点）
      - name: Offline reliability suite
        run: >-
          mvn -B -f pom.xml test -Dskip.spotless=true
          -Dtest='Wave23*Test,*Checkpoint*,*Idempotency*,*Replay*,*HealthEvaluator*,*DDL*,*RowIdentity*,*Lease*'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Collect reliability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: warn

  # 操作手册必须随功能实时更新：新增配置项、菜单或 Wave 基线未同步时直接阻断
  docs-sync:
    name: Operation manual sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify operation manual is in sync
        run: python tools/check_manual_sync.py

  # Wave24：根目录 26 个手工 E2E 脚本纳入流水线。语法/清点卡口恒跑，不连任何数据库。
  e2e-gate:
    name: E2E scripts gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check E2E scripts syntax and inventory
        run: python tools/e2e/run_offline_e2e.py --ci

      - name: Collect E2E gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gate-report
          path: reports/E2E_OFFLINE_GATE.json
          if-no-files-found: warn

  # 真机 E2E 仅在显式触发时登记连接条件；真正执行 RealDbE2eHarness 需自有机房 runner。
  real-db-e2e:
    name: Real DB E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: e2e-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check real DB prerequisites
        env:
          DBDATASYNC_E2E_CONFIG: ${{ secrets.DBDATASYNC_E2E_CONFIG }}
        run: python tools/e2e/run_offline_e2e.py --real-db

  # Wave27：真库全链路 E2E 实跑（H2 文件库 vendor，无外部依赖，每次 push/PR 都跑）。
  # 流水线：建表 → Trigger CDC 捕获 → 事件还原 → 目标端真实应用 → 一致性校验 → 切流真实动作 + SQL。
  # 外部 MySQL/PG/Oracle 连接串可用 secrets.DBDATASYNC_E2E_PROPS 生成 properties 后按同一流水线执行。
  real-pipeline-e2e:
    name: Real pipeline E2E (H2 vendor)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run real pipeline E2E
        run: bash tools/e2e/run_real_pipeline_e2e.sh

      - name: Collect E2E output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pipeline-e2e-log
          path: target/e2e_classes/
          if-no-files-found: ignore
