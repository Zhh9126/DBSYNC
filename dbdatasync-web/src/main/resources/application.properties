# 服务IP
server.ip=127.0.0.1
# 访问端口
server.port=18686

# 启用SSL配置(false-关闭; true-开启)
server.ssl.enabled=false
# 指定外部配置文件
server.ssl.key-store=conf/dbdatasync.p12
server.ssl.key-store-password=DBDataSync
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=DBDataSync

# 启用http端口(false-关闭; true-开启)
server.http.enabled=false
# server.ssl.enabled和server.http.enabled同时开启生效
server.http.port=8080
# 强制http重定向https端口(false-关闭; true-开启)
server.http.redirect=false

# 会话过期时间(秒)
server.servlet.session.timeout=1800
# 访问服务的路径，‘/’ -> http://${server.ip}:${server.port}/
server.servlet.context-path=/
spring.profiles.active=default
#All < Trace < Debug < Info < Warn < Error < Fatal < OFF
logging.level.root=info

#web
# 机器的唯一编号（单机部署则填默认值; 部署集群时, 要保证编号在集群中唯一）
dbdatasync.web.worker.id=1
# 定时任务线程数
dbdatasync.web.scheduler.pool-size=8
# 重置admin默认密码（false-禁用; true-重置, 高危操作, 恢复后一定要改回false）
dbdatasync.web.security.reset-pwd=false

#common
# 调度线程数
dbdatasync.common.dispatch.thread-core-size=8
# 调度最大线程数
dbdatasync.common.dispatch.max-thread-size=16
# 调度线程池队列
dbdatasync.common.dispatch.thread-queue-capacity=64

#parser
# *********************** 通用执行器配置 ***********************
# [GeneralBufferActuator]线程数
dbdatasync.parser.general.thread-core-size=8
# [GeneralBufferActuator]最大线程数
dbdatasync.parser.general.max-thread-size=16
# [GeneralBufferActuator]线程池队列
dbdatasync.parser.general.thread-queue-capacity=64
# [GeneralBufferActuator]单次执行任务数
dbdatasync.parser.general.buffer-writer-count=1000
# [GeneralBufferActuator]每次消费缓存队列的任务数
dbdatasync.parser.general.buffer-pull-count=20000
# [GeneralBufferActuator]缓存队列容量
dbdatasync.parser.general.buffer-queue-capacity=50000
# [GeneralBufferActuator]定时消费缓存队列间隔(毫秒)
dbdatasync.parser.general.buffer-period-millisecond=300
# *********************** 表执行器配置 ***********************
# [TableGroupBufferActuator]线程数
dbdatasync.parser.table.group.thread-core-size=1
# [TableGroupBufferActuator]最大线程数
dbdatasync.parser.table.group.max-thread-size=1
# [TableGroupBufferActuator]线程池队列
dbdatasync.parser.table.group.thread-queue-capacity=16
# [TableGroupBufferActuator]单次执行任务数
dbdatasync.parser.table.group.buffer-writer-count=1000
# [TableGroupBufferActuator]每次消费缓存队列的任务数
dbdatasync.parser.table.group.buffer-pull-count=1000
# [TableGroupBufferActuator]缓存队列容量
dbdatasync.parser.table.group.buffer-queue-capacity=10000
# [TableGroupBufferActuator]定时消费缓存队列间隔(毫秒)
dbdatasync.parser.table.group.buffer-period-millisecond=300

#storage
# 数据存储类型:h2(默认)/mysql(推荐生产环境使用)
dbdatasync.storage.type=h2
dbdatasync.storage.h2.url=jdbc:h2:file:./data/DBDataSync;MODE=MySQL;DB_CLOSE_DELAY=-1;TRACE_LEVEL_FILE=0;TRACE_LEVEL_SYSTEM_OUT=0
dbdatasync.storage.h2.username=sa
# 生产若需加密，可在首次部署时就设好，需在第一次创建库文件之前配置好（或删掉旧库后重启）。
dbdatasync.storage.h2.password=
dbdatasync.storage.mysql.url=jdbc:mysql://127.0.0.1:3306/DBDataSync?rewriteBatchedStatements=true&seUnicode=true&characterEncoding=UTF8&serverTimezone=Asia/Shanghai&useSSL=false&verifyServerCertificate=false&autoReconnect=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true
dbdatasync.storage.mysql.username=root
dbdatasync.storage.mysql.password=123
# [StorageBufferActuator]线程数
dbdatasync.storage.thread-core-size=4
# [StorageBufferActuator]最大线程数
dbdatasync.storage.max-thread-size=8
# [StorageBufferActuator]线程池队列
dbdatasync.storage.thread-queue-capacity=64
# [StorageBufferActuator]单次执行任务数
dbdatasync.storage.buffer-writer-count=1000
# [StorageBufferActuator]每次消费缓存队列的任务数
dbdatasync.storage.buffer-pull-count=20000
# [StorageBufferActuator]缓存队列容量
dbdatasync.storage.buffer-queue-capacity=50000
# [StorageBufferActuator]定时消费缓存队列间隔(毫秒)
dbdatasync.storage.buffer-period-millisecond=300

# 会话 Cookie 加固：SameSite=Strict 缓解 CSRF 跨站请求伪造
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# 内网工具: 静态资源不缓存, 保证 JS/CSS 更新即时生效(浏览器无强刷依赖)
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
