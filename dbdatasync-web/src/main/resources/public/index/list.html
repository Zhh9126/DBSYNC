<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div th:fragment="index">
<div class="ui-page">

    <!-- ============ 顶部渐变横幅 ============ -->
    <section class="hero-banner">
        <div class="hero-orb hero-orb-a"></div>
        <div class="hero-orb hero-orb-b"></div>
        <div class="hero-ring"></div>

        <div class="hero-content">
            <span class="hero-eyebrow"><i class="fa fa-circle"></i>DATA SYNC OVERVIEW</span>
            <h1 class="hero-title">数据集成控制台 · 运行总览</h1>
            <p class="hero-sub">统一纳管异构数据源，覆盖全量迁移、实时增量、整库迁移与数据校验，链路状态一目了然。</p>
            <div class="hero-actions">
                <button class="hero-btn hero-btn-solid" type="button"
                        onclick="window.uiSetCrumb&&window.uiSetCrumb('数据同步'); doLoader('/mapping/pageAdd')">
                    <i class="fa fa-plus"></i> 新建同步任务
                </button>
                <button class="hero-btn" type="button"
                        onclick="window.uiSetCrumb&&window.uiSetCrumb('连接管理'); doLoader('/connector/page/add')">
                    <i class="fa fa-database"></i> 添加数据源
                </button>
                <button class="hero-btn" type="button"
                        onclick="window.uiSetCrumb&&window.uiSetCrumb('同步数据明细'); drillDataPage({})">
                    <i class="fa fa-line-chart"></i> 运行报表
                </button>
            </div>
        </div>

        <div class="hero-metrics">
            <div class="hero-metric">
                <div class="hero-metric-label">同步任务</div>
                <div class="hero-metric-value" id="heroTotalMeta">--</div>
                <div class="hero-metric-foot">全部任务数</div>
            </div>
            <div class="hero-metric">
                <div class="hero-metric-label">运行中</div>
                <div class="hero-metric-value" id="heroRunMeta">--</div>
                <div class="hero-metric-foot">实时执行中</div>
            </div>
            <div class="hero-metric">
                <div class="hero-metric-label">成功率</div>
                <div class="hero-metric-value" id="heroSuccessRate">--<small>%</small></div>
                <div class="hero-metric-foot">按同步记录统计</div>
            </div>
        </div>
    </section>

    <!-- ============ 核心指标 ============ -->
    <div class="kpi-grid">
        <div class="card kpi-card kpi-accent-blue" id="totalMeta" style="cursor:pointer"
             onclick="drillMappingList()" title="点击查看全部任务"></div>

        <div class="card kpi-card kpi-accent-green" id="runningMeta" style="cursor:pointer"
             onclick="drillMappingList()" title="点击查看任务列表"></div>

        <div class="card kpi-card kpi-accent-red" style="cursor:pointer"
             onclick="drillMappingList()" title="点击查看任务列表并处理失败任务">
            <div class="kpi-top">
                <p class="kpi-label">失败任务</p>
                <div class="kpi-icon"><i class="fa fa-exclamation-triangle"></i></div>
            </div>
            <div class="kpi-main">
                <span class="kpi-value" id="failMeta">--</span>
                <span class="kpi-unit">个</span>
            </div>
            <div class="kpi-foot"><span class="kpi-trend flat">需关注</span><span>异常任务建议及时处理</span></div>
            <svg class="kpi-spark" viewBox="0 0 118 52" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 L18 30 L34 34 L52 20 L70 26 L88 14 L118 22" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/></svg>
        </div>

        <div class="card kpi-card kpi-accent-cyan cursor-pointer" id="allData"
             onclick="drillDataPage({})" title="点击查看同步数据明细"></div>
    </div>

    <!-- ============ 图表区 ============ -->
    <div class="grid grid-cols-1 lg:grid-cols-3 mb-5">
        <!-- 同步趋势 -->
        <div class="form-container panel-card lg:col-span-2">
            <div class="panel-head">
                <h3 class="panel-title"><i class="fa fa-line-chart"></i>同步趋势<span class="panel-sub">成功 / 失败记录按日统计</span></h3>
                <div class="seg-control">
                    <button class="btn btn-outline text-sm trend-item text-primary" data-key="7">一周</button>
                    <button class="btn btn-outline text-sm trend-item" data-key="15">半个月</button>
                    <button class="btn btn-outline text-sm trend-item" data-key="30">一个月</button>
                </div>
            </div>
            <div class="panel-body chart-wrap">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- 事件统计 + 任务状态 -->
        <div class="form-container panel-card lg:col-span-1">
            <div class="panel-head">
                <h3 class="panel-title"><i class="fa fa-pie-chart"></i>同步事件<span class="panel-sub">点击可下钻明细</span></h3>
            </div>
            <div class="panel-body">
                <div id="statistic" class="mini-stats-grid mb-3"></div>
                <p class="section-caption">任务状态分布</p>
                <div class="chart-wrap">
                    <canvas id="statusDoughnutChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ 连接与任务 ============ -->
    <div class="grid grid-cols-1 lg:grid-cols-3">
        <!-- 左侧：连接列表 -->
        <div class="form-container panel-card lg:col-span-1">
            <div class="panel-head">
                <h3 class="panel-title"><i class="fa fa-database"></i>数据源连接</h3>
                <button class="btn btn-info btn-sm" onclick="window.uiSetCrumb&&window.uiSetCrumb('连接管理'); doLoader('/connector/page/add')">
                    <i class="fa fa-plus"></i><span>添加连接</span>
                </button>
            </div>
            <div class="panel-body flush">
                <div id="connectorTable"></div>
                <div id="connectorPagination"></div>
            </div>
        </div>

        <!-- 右侧：最近同步任务 -->
        <div class="form-container panel-card lg:col-span-2">
            <div class="panel-head">
                <h3 class="panel-title"><i class="fa fa-exchange"></i>最近同步任务<span class="panel-sub">最近更新的驱动与状态</span></h3>
                <button class="btn btn-info btn-sm" onclick="window.uiSetCrumb&&window.uiSetCrumb('数据同步'); doLoader('/mapping/pageAdd')">
                    <i class="fa fa-plus"></i><span>添加同步</span>
                </button>
            </div>
            <div class="panel-body flush">
                <table class="table">
                    <thead>
                    <tr class="text-left">
                        <th>名称</th>
                        <th>类型</th>
                        <th>结果</th>
                        <th>状态</th>
                        <th>最后同步</th>
                    </tr>
                    </thead>
                    <tbody id="mappingTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <p class="text-xs text-center mt-4 mb-2" style="color:var(--text-tertiary)">
        DBDataSync · 通用数据同步中间件　|　数据实时刷新，所有指标来源于 /monitor/dashboard
    </p>
</div>

<script>
    // 仪表盘下钻：任务列表 / 同步数据明细
    window.drillMappingList = function () {
        doLoader('/mapping/list');
    };
    window.drillDataPage = function (filters) {
        try {
            sessionStorage.setItem('dashboard.drill', JSON.stringify(filters || {}));
        } catch (e) { /* ignore */ }
        doLoader('/monitor/page/data');
    };

    $(function () {
        // 定义返回函数，子页面返回
        window.backIndexPage = function () {
            doLoader('/index');
        };

        const sparkLine = '<svg class="kpi-spark" viewBox="0 0 118 52" preserveAspectRatio="none" aria-hidden="true">'
            + '<path d="M0 42 L16 36 L32 38 L48 24 L64 28 L82 14 L100 18 L118 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

        // 同步趋势图表
        const trendCanvas = document.getElementById('trendChart');
        if (!trendCanvas) {
            console.error('trendChart 元素未找到');
        }
        const trendCtx = trendCanvas ? trendCanvas.getContext('2d') : null;
        const trendChart = trendCtx ? new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: '同步成功',
                        data: [],
                        borderColor: '#2563EB',
                        borderWidth: 2.5,
                        backgroundColor: 'rgba(37, 99, 235, 0.12)',
                        pointBackgroundColor: '#2563EB',
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        tension: 0.35,
                        fill: true
                    },
                    {
                        label: '同步失败',
                        data: [],
                        borderColor: '#F59E0B',
                        borderWidth: 2,
                        backgroundColor: 'rgba(245, 158, 11, 0.12)',
                        pointBackgroundColor: '#F59E0B',
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        tension: 0.35,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                aspectRatio: 2.35,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: 18, color: '#64748B' }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.92)',
                        padding: 10,
                        cornerRadius: 8,
                        titleFont: { size: 12 },
                        bodyFont: { size: 12 }
                    }
                },
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#94A3B8', font: { size: 11 } } },
                    y: { beginAtZero: true, grid: { color: 'rgba(148, 163, 184, 0.16)' }, ticks: { color: '#94A3B8', font: { size: 11 }, precision: 0 } }
                }
            }
        }) : null;

        // 任务状态分布柱状图
        const statusDoughnutCanvas = document.getElementById('statusDoughnutChart');
        const statusDoughnutCtx = statusDoughnutCanvas ? statusDoughnutCanvas.getContext('2d') : null;
        const statusDoughnutChart = statusDoughnutCtx ? new Chart(statusDoughnutCtx, {
            type: 'bar',
            data: {
                labels: ['总任务', '运行中', '已失败'],
                datasets: [{
                    data: [0, 0, 0],
                    backgroundColor: [
                        'rgba(37, 99, 235, 0.72)',
                        'rgba(16, 185, 129, 0.72)',
                        'rgba(239, 68, 68, 0.72)'
                    ],
                    borderWidth: 0,
                    borderRadius: 5,
                    barThickness: 15
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: true,
                aspectRatio: 2.1,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.92)',
                        cornerRadius: 8,
                        callbacks: {
                            label: function (context) {
                                return context.label + ': ' + context.parsed.x;
                            }
                        }
                    }
                },
                scales: {
                    x: { beginAtZero: true, grid: { color: 'rgba(148, 163, 184, 0.16)' }, ticks: { color: '#94A3B8', font: { size: 11 }, precision: 0 } },
                    y: { grid: { display: false }, ticks: { color: '#64748B', font: { size: 11 } } }
                }
            }
        }) : null;

        const trendConfig = {
            'data': {},
            'type': '7',
            '7': function (data) {
                if (!data || data.length === 0) { return []; }
                return data.length > 7 ? data.slice(-7) : data;
            },
            '15': function (data) {
                if (!data || data.length === 0) { return []; }
                return data.length > 15 ? data.slice(-15) : data;
            },
            '30': function (data) {
                return data || [];
            }
        };
        function refreshLineChatData(trend) {
            if (!trendChart) return;
            trendConfig['data'] = trend;
            let strategy = trendConfig[trendConfig.type];
            trendChart.data.labels = strategy(trend.labels);
            trendChart.data.datasets[0].data = strategy(trend.success);
            trendChart.data.datasets[1].data = strategy(trend.fail);
            trendChart.update('none');
        }
        $('.trend-item').unbind('click').bind('click', function () {
            $('.trend-item').removeClass('text-primary');
            $(this).addClass('text-primary');
            trendConfig.type = $(this).data('key');
            refreshLineChatData(trendConfig['data']);
        });

        function renderTotalMeta(r) {
            const isIncrease = r.lastWeekMeta <= r.totalMeta;
            const diff = isIncrease ? (r.totalMeta - r.lastWeekMeta) : (r.lastWeekMeta - r.totalMeta);
            const percent = r.lastWeekMeta > 0 ? (diff / r.lastWeekMeta * 100) : 0;
            const config = isIncrease ? { class: 'fa-arrow-up', text: '增长', trend: 'up' }
                                      : { class: 'fa-arrow-down', text: '降低', trend: 'down' };
            return `<div class="kpi-top">
                <p class="kpi-label">总任务数</p>
                <div class="kpi-icon"><i class="fa fa-tasks"></i></div>
            </div>
            <div class="kpi-main"><span class="kpi-value">${r.totalMeta}</span><span class="kpi-unit">个任务</span></div>
            <div class="kpi-foot">
                <span class="kpi-trend ${config.trend}"><i class="fa ${config.class}"></i>${percent.toFixed(2)}%</span>
                <span>较上周${config.text} ${diff} 个</span>
            </div>${sparkLine}`;
        }

        function renderRunningMeta(r) {
            const percent = r.totalMeta > 0 ? (r.runningMeta / r.totalMeta * 100) : 0;
            return `<div class="kpi-top">
                <p class="kpi-label">运行中任务</p>
                <div class="kpi-icon"><i class="fa fa-play"></i></div>
            </div>
            <div class="kpi-main"><span class="kpi-value">${r.runningMeta}</span><span class="kpi-unit">个任务</span></div>
            <div class="kpi-foot">
                <span class="kpi-trend up"><i class="fa fa-check"></i>正常</span>
                <span>占总任务 ${percent.toFixed(2)}%</span>
            </div>${sparkLine}`;
        }

        function renderAllData(r) {
            const total = r.success + r.fail;
            const isIncrease = r.yesterdayData <= total;
            const diff = isIncrease ? (total - r.yesterdayData) : (r.yesterdayData - total);
            const percent = r.yesterdayData > 0 ? (diff / r.yesterdayData * 100) : 0;
            const config = isIncrease ? { class: 'fa-arrow-up', text: '增长', trend: 'up' }
                                      : { class: 'fa-arrow-down', text: '降低', trend: 'down' };
            return `<div class="kpi-top">
                <p class="kpi-label">同步总数</p>
                <div class="kpi-icon"><i class="fa fa-database"></i></div>
            </div>
            <div class="kpi-main"><span class="kpi-value">${total}</span><span class="kpi-unit">条记录</span></div>
            <div class="kpi-foot">
                <span class="kpi-trend ${config.trend}"><i class="fa ${config.class}"></i>${percent.toFixed(2)}%</span>
                <span>较昨日${config.text}</span>
            </div>${sparkLine}`;
        }

        function renderStatistic(r) {
            const statistic = [
                { key: 'success', title: '成功', bgColor: 'success', drill: { status: '1' } },
                { key: 'fail', title: '失败', bgColor: 'error', drill: { status: '0' } },
                { key: 'insert', title: '新增', bgColor: 'primary', drill: { event: 'INSERT' } },
                { key: 'update', title: '修改', bgColor: 'info', drill: { event: 'UPDATE' } },
                { key: 'delete', title: '删除', bgColor: 'warning', drill: { event: 'DELETE' } },
                { key: 'ddl', title: 'DDL', bgColor: 'violet', drill: { event: 'ALTER' } }
            ];

            const html = statistic.map(item => `
                <div class="mini-stat-card mini-stat-card--${item.bgColor} cursor-pointer"
                     style="cursor:pointer"
                     title="点击查看明细"
                     onclick="drillDataPage(${JSON.stringify(item.drill).replace(/"/g, '&quot;')})">
                    <div class="mini-stat-info">
                        <p class="mini-stat-title">${item.title}</p>
                    </div>
                    <span class="mini-stat-number text-${item.bgColor}" title="${r[item.key] || 0}">
                        ${r[item.key] || 0}
                    </span>
                </div>
            `).join('');

            $("#statistic").html(html);
        }

        // 刷新仪表板数据
        function refreshDashboardData() {
            doGetter("/monitor/dashboard", {}, function (response) {
                if (response.success === true) {
                    const r = response.data;
                    $("#totalMeta").html(renderTotalMeta(r));
                    $("#runningMeta").html(renderRunningMeta(r));
                    $("#failMeta").text(r.failMeta);
                    $("#allData").html(renderAllData(r));
                    // 生成迷你卡片
                    renderStatistic(r);
                    refreshLineChatData(r.trend);

                    // 顶部横幅实时指标
                    $("#heroTotalMeta").text(r.totalMeta != null ? r.totalMeta : '--');
                    $("#heroRunMeta").text(r.runningMeta != null ? r.runningMeta : '--');
                    const succ = Number(r.success || 0), fail = Number(r.fail || 0);
                    const rate = (succ + fail) > 0 ? (succ / (succ + fail) * 100).toFixed(1) : '--';
                    $("#heroSuccessRate").html(rate + '<small>%</small>');

                    // 更新柱状图数据
                    if (statusDoughnutChart) {
                        statusDoughnutChart.data.datasets[0].data = [
                            r.totalMeta || 0,
                            r.runningMeta || 0,
                            r.failMeta || 0
                        ];
                        statusDoughnutChart.update('none');
                    }
                }
            });
        }

        // 初始化分页管理器
        let searchConnector = new PaginationManager({
            requestUrl: '/connector/search',
            tableBodySelector: '#connectorTable',
            paginationSelector: '#connectorPagination',
            pageSize: 3,
            showBoundaryButtons: false,
            renderRow: function (connector, index) {
                return `<div class="conn-row">
                    <div class="flex items-center" style="min-width:0">
                        <div class="conn-logo">
                            <img draggable="false" src="${$basePath}/img/${escapeHtml((connector.config && connector.config.connectorType) || '')}.png" alt="${escapeHtml((connector.config && connector.config.connectorType) || '')}">
                        </div>
                        <div class="ml-3" style="min-width:0">
                            <p class="conn-name">${escapeHtml(connector.name)}</p>
                            <p class="conn-url" title="${escapeHtml((connector.config && connector.config.url) || '')}">${escapeHtml((connector.config && connector.config.url) || '')}</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        ${connector.running ? '<span class="badge badge-success">在线</span>' : '<span class="badge badge-error">离线</span>'}
                    </div>
                </div>`;
            },
            emptyHtml: '<div class="empty-state"><i class="fa fa-database empty-icon"></i><p class="empty-text">暂无连接</p><p class="empty-description">点击"添加连接"创建第一个数据源</p></div>'
        });

        // 初始化分页管理器
        let searchMapping = new PaginationManager({
            requestUrl: '/mapping/search',
            tableBodySelector: '#mappingTable',
            pageSize: 5,
            showBoundaryButtons: false,
            renderRow: function (mapping, index) {
                return `<tr>
                    <td><div class="font-medium">${escapeHtml(mapping.name)}</div></td>
                    <td>${renderModelText(mapping && mapping.model)}</td>
                    <td>${renderSyncResult(mapping)}</td>
                    <td>${renderStateText((mapping && mapping.meta && mapping.meta.state) || 0)}</td>
                    <td>${formatRelativeTime((mapping && mapping.meta && mapping.meta.updateTime) || '')}</td>
                </tr>`;
            },
            emptyHtml: '<td colspan="5" class="text-center"><i class="fa fa-exchange empty-icon"></i><p class="empty-text">暂无驱动</p><p class="empty-description">点击"添加同步"创建第一个驱动</p></td>'
        });

        // 初始化时立即刷新一次
        refreshDashboardData();

        // 注册到全局定时刷新管理器
        PageRefreshManager.register(() => {
            refreshDashboardData();
            searchConnector.doSearch({}, searchConnector.currentPage);
            searchMapping.doSearch({}, searchMapping.currentPage);
        });

    });
</script>
</div>
</html>
