<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">添加整库迁移</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4">
            <button id="database-sync-submit-btn" type="button" class="btn btn-primary">
                <i class="fa fa-save"></i> 保存
            </button>
            <button class="btn btn-outline" type="button" onclick="backIndexPage()">
                <i class="fa fa-reply"></i> 返回
            </button>
        </div>

        <form id="database-sync-form">
            <div class="grid grid-cols-2">
                <div class="form-item">
                    <label class="form-label">任务名称<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input class="form-control" name="name" type="text" maxlength="50" required
                               placeholder="请输入任务名称"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">
                        <i class="fa fa-database text-primary"></i> 源端<strong class="text-primary">*</strong>
                    </label>
                    <select id="sourceConnectorId" class="form-control"></select>
                </div>
            </div>

            <div class="mt-5" th:replace="database-sync/syncStrategy :: content"></div>

            <div class="mt-5">
                <h4 class="mb-3 font-medium">
                    <i class="fa fa-sitemap text-primary"></i> 库映射配置
                </h4>
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-0 min-h-520   rounded  overflow-hidden bg-primary">
                    <aside class="lg:col-span-3 flex flex-col  bg-secondary p-4 min-h-0 min-w-0">
                        <div class="font-medium mb-3">
                            库映射关系 (<span id="mappingCount">0</span>)
                        </div>
                        <button type="button" id="btnAddDbMapping" class="btn btn-primary w-full mb-3">
                            <i class="fa fa-plus"></i> 添加库映射关系
                        </button>
                        <button type="button" id="btnExpandDatabases" class="btn btn-outline w-full mb-3" title="按源连接器实例枚举全部业务库，一键生成同名库映射对">
                            <i class="fa fa-th"></i> 一键映射全部库
                        </button>
                        <div id="mappingCardList" class="flex-1 overflow-y-auto min-h-0"></div>
                        <div id="mappingSidebarEmpty" class="text-center text-tertiary p-6 hidden">
                            <i class="fa fa-database empty-icon"></i>
                            <p class="empty-text mt-2">暂无库映射</p>
                            <p class="empty-description text-sm">选择源端连接器后，点击「添加库映射关系」选择表</p>
                        </div>
                    </aside>

                    <section class="lg:col-span-9 workspace-detail flex flex-col min-h-0 min-w-0">
                        <div id="mappingDetailPanel" class="card card-static workspace-detail-panel flex flex-col flex-1 min-h-0 hidden">
                            <div class="card-body border-b mb-0">
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="form-item mb-0">
                                        <label class="form-label">目标连接<strong class="text-primary">*</strong></label>
                                        <div class="form-control-area">
                                            <select id="targetConnectorId" class="form-control"></select>
                                        </div>
                                    </div>
                                    <div class="form-item mb-0">
                                        <label class="form-label">目标库名<strong class="text-primary">*</strong></label>
                                        <div class="form-control-area">
                                            <input type="text" id="detailTargetDatabase" class="form-control"
                                                   maxlength="128" placeholder="目标库名"/>
                                        </div>
                                        <div class="text-xs text-tertiary mt-1" id="multiTargetHint" style="display:none;">
                                            <i class="fa fa-copy"></i> 已映射到 <span id="multiTargetCount">0</span> 个目标库
                                        </div>
                                    </div>
                                    <div class="form-item mb-0" id="detailTargetSchemaWrap">
                                        <label class="form-label">目标 Schema</label>
                                        <div class="form-control-area">
                                            <input type="text" id="detailTargetSchema" class="form-control" maxlength="128"
                                                   placeholder="目标 Schema"/>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card-header flex items-center justify-between gap-2">
                                <h4 class="card-title mb-0" id="mappingDetailTitle">
                                    <i class="fa fa-table"></i> 表映射明细
                                </h4>
                                <div class="flex items-center gap-2">
                                    <button type="button" id="btnMultiTargets" class="btn btn-outline btn-sm"
                                            title="把当前源库映射到同连接器的多个目标库（一源多目标）">
                                        <i class="fa fa-clone"></i> 多目标库
                                    </button>
                                    <button type="button" id="btnAddTablesToMapping" class="btn btn-outline btn-sm">
                                        <i class="fa fa-plus"></i> 添加表
                                    </button>
                                    <button type="button" id="btnBatchTablePrefix" class="btn btn-outline btn-sm">
                                        批量加目标表前缀
                                    </button>
                                </div>
                            </div>
                            <div class="card-body table-scroll-panel">
                                <table class="table table-sm">
                                    <thead>
                                    <tr>
                                        <th class="width50px">序号</th>
                                        <th>源表名</th>
                                        <th>目标表名<strong class="text-primary">*</strong> <i class="fa fa-pencil text-tertiary"></i></th>
                                        <th class="width80px">操作</th>
                                    </tr>
                                    </thead>
                                    <tbody id="mappingDetailTableBody"></tbody>
                                </table>
                            </div>
                            <div id="mappingDetailPagination" class="pagination hidden">
                                <p class="pagination-info mb-0">
                                    共 <span class="mappingDetailTotalCount">0</span> 条，第
                                    <span class="mappingDetailCurrentPage">1</span> /
                                    <span class="mappingDetailTotalPages">1</span> 页
                                </p>
                                <div class="pagination-bar"></div>
                            </div>
                        </div>
                        <div id="mappingWorkspaceEmpty" class="card card-static workspace-empty flex flex-col flex-1 min-h-280">
                            <div class="card-body flex flex-col items-center justify-center text-center text-tertiary flex-1">
                                <i class="fa fa-hand-pointer-o empty-icon"></i>
                                <p class="empty-text mt-2">请选择左侧库映射</p>
                                <p class="empty-description text-sm">点击库映射卡片查看表映射明细</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

            <input type="hidden" name="databaseMappingsJson" id="databaseMappingsJson" value="[]"/>
        </form>

        <!-- Wave10 P1-3：应用 SQL 兼容度预检（可选，默认收起 / 不填不生效）。
             置于 form 之外且所有控件无 name，保存时 $form.serializeJson() 不会携带任何预检字段。 -->
        <details class="mt-5 border rounded bg-surface" id="sqlPrecheckSection">
            <summary class="p-3 font-medium text-sm cursor-pointer">
                <i class="fa fa-search text-primary"></i> 应用 SQL 兼容度预检
                <span class="text-xs text-tertiary ml-2">（可选 · 默认收起 · 不填不生效）</span>
            </summary>
            <div class="p-3 border-t">
                <div class="tip-box mb-3 text-xs">
                    输入应用 SQL 文本（多语句）或本地 SQL 目录，生成<strong>兼容度预检报告</strong>。
                    <br><span class="text-tertiary">仅提示、不阻断任务创建；报告仅展示，不执行任何 SQL、不连库、不自动执行 DDL。</span>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="form-label">源方言</label>
                        <select id="precheckSourceDialect" class="form-control">
                            <option value="">请选择源数据库</option>
                            <option value="MySQL">MySQL</option>
                            <option value="TiDB">TiDB</option>
                            <option value="Oracle">Oracle</option>
                            <option value="OceanBase">OceanBase</option>
                            <option value="DM">DM</option>
                            <option value="PostgreSQL">PostgreSQL</option>
                            <option value="Kingbase">Kingbase</option>
                            <option value="SQLServer">SQLServer</option>
                            <option value="ClickHouse">ClickHouse</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">目标方言</label>
                        <select id="precheckTargetDialect" class="form-control">
                            <option value="">请选择目标数据库</option>
                            <option value="MySQL">MySQL</option>
                            <option value="TiDB">TiDB</option>
                            <option value="Oracle">Oracle</option>
                            <option value="OceanBase">OceanBase</option>
                            <option value="DM">DM</option>
                            <option value="PostgreSQL">PostgreSQL</option>
                            <option value="Kingbase">Kingbase</option>
                            <option value="SQLServer">SQLServer</option>
                            <option value="ClickHouse">ClickHouse</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">应用 SQL 文本（多语句，以分号分隔）</label>
                    <textarea id="precheckSqlText" class="form-control" rows="5"
                              placeholder="SELECT NVL(a,0) FROM t WHERE ROWNUM <= 10;&#10;SELECT * FROM t CONNECT BY PRIOR id = pid;"
                              style="font-family: Consolas, Menlo, monospace; font-size: 13px;"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">本地 SQL 目录（可选，纯文件 IO，仅读取 *.sql）</label>
                    <input id="precheckSqlDir" class="form-control" type="text"
                           placeholder="例如：E:/app/sql（服务端本地目录，深度≤3 / 200 文件 / 单文件 1MB / 总计 10MB）"/>
                </div>
                <div class="mb-3">
                    <button type="button" class="btn btn-outline" id="precheckRunBtn" onclick="runSqlPrecheck()">
                        <i class="fa fa-search"></i> 生成预检报告
                    </button>
                </div>
                <div id="precheckReport" style="display:none;"></div>
            </div>
        </details>
    </div>
    <div class="blank-block"></div>
</div>

<script th:inline="javascript">
    window.DATABASE_SYNC_PAGE = {
        mode: 'add',
        readOnly: false,
        task: null
    };

    // Wave10 P1-3：可选预检（独立接口 /database-sync/sqlPrecheck）。
    // 默认收起，不填不生效；报告仅展示，不写入任务、不阻断保存。
    function runSqlPrecheck() {
        const text = document.getElementById('precheckSqlText').value.trim();
        const dir = document.getElementById('precheckSqlDir').value.trim();
        const source = document.getElementById('precheckSourceDialect').value;
        const target = document.getElementById('precheckTargetDialect').value;
        if (!text && !dir) {
            bootGrowl('请填写 SQL 文本或本地 SQL 目录（可选，不填不生效）', 'warning');
            return;
        }
        const btn = document.getElementById('precheckRunBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 预检中…';
        doPoster('/database-sync/sqlPrecheck', {
            appSqlText: text,
            appSqlDir: dir,
            sourceDialect: source,
            targetDialect: target
        }, function (response) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-search"></i> 生成预检报告';
            const box = document.getElementById('precheckReport');
            box.style.display = 'block';
            if (!response.success) {
                box.innerHTML = '<div class="p-2 text-xs text-danger border rounded bg-surface">'
                    + escapeHtml(response.message || '预检失败') + '</div>';
                return;
            }
            renderPrecheckReport(response.data || {});
        });
    }

    function renderPrecheckReport(report) {
        const box = document.getElementById('precheckReport');
        const result = report.result || null;
        let html = '<div class="p-2 mb-2 text-xs text-tertiary border rounded bg-surface">'
            + '输入模式：' + escapeHtml(report.inputMode || 'none')
            + ' ｜ ' + escapeHtml(report.inputSummary || '')
            + ' ｜ ' + escapeHtml(report.hint || '仅提示，不阻断任务创建')
            + ' ｜ 阻断任务创建：' + (report.blocking ? '是' : '否') + '</div>';
        if (!result) {
            html += '<div class="p-2 text-xs text-tertiary">未输入有效 SQL，未执行扫描。</div>';
            box.innerHTML = html;
            return;
        }
        html += '<div class="mb-2">'
            + '<span class="badge badge-error">阻断 ' + (result.errorCount || 0) + '</span> '
            + '<span class="badge badge-warning">告警 ' + (result.warnCount || 0) + '</span> '
            + '<span class="badge badge-info">提示 ' + (result.infoCount || 0) + '</span> '
            + '<span class="text-xs text-tertiary ml-2">共 '
            + (result.statementCount || 0) + ' 条语句</span></div>';
        const issues = result.issues || [];
        if (!issues.length) {
            html += '<div class="p-2 text-xs text-tertiary">暂无问题清单。</div>';
        } else {
            html += '<div style="max-height:360px;overflow:auto;">'
                + '<table class="table table-compact"><thead><tr>'
                + '<th>级别</th><th>代号</th><th>元素</th><th>说明</th><th>建议</th>'
                + '</tr></thead><tbody>';
            issues.forEach(function (x) {
                html += '<tr><td class="text-xs">' + escapeHtml(x.level || '') + '</td>'
                    + '<td class="text-xs whitespace-nowrap">' + escapeHtml(x.code || '') + '</td>'
                    + '<td class="text-xs">' + escapeHtml(x.element || '') + '</td>'
                    + '<td class="text-xs">' + escapeHtml(x.message || '') + '</td>'
                    + '<td class="text-xs">' + escapeHtml(x.suggestion || '') + '</td></tr>';
            });
            html += '</tbody></table></div>';
        }
        box.innerHTML = html;
    }
</script>
<script th:src="@{/js/database-sync/database-sync.js}"></script>
</html>
