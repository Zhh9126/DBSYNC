<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<!-- 顶部通栏内联：与源端连接器同一行 -->
<div th:fragment="bar">
    <div class="ds-strategy-checks">
        <div>
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group">
                <input type="checkbox" name="enableCopySchema" id="dbSyncEnableCopySchema"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteSchema"
                       th:checked="${task == null ? true : task.enableCopySchema}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopySchema">复制表结构</label>
            </div>
            <div>
                <span>覆盖结构</span>
                <label class="form-switch">
                    <input name="overwriteSchema" type="checkbox" value="true"
                           th:checked="${task?.overwriteSchema}"
                           th:disabled="${readOnly}"/>
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
                <span title="开启覆盖结构，会删除目标库已经存在的表">
                    <i class="fa fa-info-circle"></i> 开启覆盖结构，会删除目标库已经存在的表
                </span>
            </div>
        </div>
        <div>
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group">
                <input type="checkbox" name="enableCopyData" id="dbSyncEnableCopyData"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteData"
                       th:checked="${task == null ? true : task.enableCopyData}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopyData">同步数据</label>
            </div>
            <div>
                <span>覆盖数据</span>
                <label class="form-switch">
                    <input name="overwriteData" type="checkbox" value="true"
                           th:checked="${task?.overwriteData}"
                           th:disabled="${readOnly}"/>
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
        <div>
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group">
                <input type="checkbox" name="enableAutoDiscover" id="dbSyncEnableAutoDiscover"
                       class="db-sync-strategy-enable" value="true"
                       th:checked="${task == null ? false : task.enableAutoDiscover}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableAutoDiscover">自动发现新表</label>
            </div>
            <div>
                <span title="每次启动运行时扫描源端库，发现新增表将自动建表并同步（需开启复制表结构或目标表已存在）">
                    <i class="fa fa-info-circle"></i> 运行时扫描源端新增表，自动建表并同步
                </span>
            </div>
        </div>
    </div>
</div>

<div th:fragment="content" >
    <h4 class="mb-3 font-medium">
        <i class="fa fa-cogs text-primary"></i> 迁移策略
    </h4>
    <div class="grid grid-cols-2 gap-4">
        <!-- 复制表结构 -->
        <div class="flex items-center gap-6 flex-wrap">
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group mb-0">
                <input type="checkbox" name="enableCopySchema" id="dbSyncEnableCopySchemaContent"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteSchema"
                       th:checked="${task?.enableCopySchema}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopySchemaContent">复制表结构</label>
            </div>
            <div class="form-item mb-0">
                <label class="form-label">
                    是否覆盖
                    <i class="fa fa-question-circle text-tertiary" title="开启覆盖结构，会删除目标已经存在的表"></i>
                </label>
                <div class="form-control-area">
                    <label class="form-switch">
                        <input name="overwriteSchema" type="checkbox" value="true"
                               th:checked="${task?.overwriteSchema}"
                               th:disabled="${readOnly}"/>
                        <span class="switch-track">
                            <span class="switch-option switch-option-on">Yes</span>
                            <span class="switch-option switch-option-off">No</span>
                            <span class="switch-thumb"></span>
                        </span>
                    </label>
                </div>
            </div>
        </div>
        <!-- 数据 -->
        <div class="flex items-center gap-6 flex-wrap">
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group mb-0">
                <input type="checkbox" name="enableCopyData" id="dbSyncEnableCopyDataContent"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteData"
                       th:checked="${task?.enableCopyData}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopyDataContent">同步数据</label>
            </div>
            <div class="form-item mb-0">
                <label class="form-label">
                    是否覆盖
                    <i class="fa fa-question-circle text-tertiary" title="目标表已存在数据时是否覆盖"></i>
                </label>
                <div class="form-control-area">
                    <label class="form-switch">
                        <input name="overwriteData" type="checkbox" value="true"
                               th:checked="${task?.overwriteData}"
                               th:disabled="${readOnly}"/>
                        <span class="switch-track">
                            <span class="switch-option switch-option-on">Yes</span>
                            <span class="switch-option switch-option-off">No</span>
                            <span class="switch-thumb"></span>
                        </span>
                    </label>
                </div>
            </div>
        </div>
        <div>
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group mb-0">
                <input type="checkbox" name="enableAutoDiscover" id="dbSyncEnableAutoDiscoverContent"
                       class="db-sync-strategy-enable" value="true"
                       th:checked="${task?.enableAutoDiscover}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableAutoDiscoverContent">自动发现新表</label>
            </div>
            <div>
                <span title="每次启动运行时扫描源端库，发现新增表将自动建表并同步（需开启复制表结构或目标表已存在）">
                    <i class="fa fa-info-circle"></i> 运行时扫描源端新增表，自动建表并同步
                </span>
            </div>
        </div>
        <!-- Wave11：限速 / 低峰时间窗 / 自动推进阶段（默认 0 / false / 空，存量任务零影响） -->
        <div class="col-span-2">
            <div class="grid grid-cols-2 gap-4 rounded border border-gray-200 p-4">
                <div class="form-item mb-0">
                    <label class="form-label" for="dbSyncRecordsPerSecond">每秒行数上限</label>
                    <div class="form-control-area">
                        <input type="number" min="0" step="1" name="recordsPerSecond" id="dbSyncRecordsPerSecond"
                               class="border border-gray-300 rounded px-2 py-1 text-sm"
                               th:value="${task == null ? 0 : task.recordsPerSecond}"
                               th:disabled="${readOnly}"/>
                        <span class="text-xs text-tertiary">每秒最多迁移行数，0 表示不限速</span>
                    </div>
                </div>
                <div class="form-item mb-0">
                    <label class="form-label" for="dbSyncBytesPerSecond">每秒字节数上限</label>
                    <div class="form-control-area">
                        <input type="number" min="0" step="1" name="bytesPerSecond" id="dbSyncBytesPerSecond"
                               class="border border-gray-300 rounded px-2 py-1 text-sm"
                               th:value="${task == null ? 0 : task.bytesPerSecond}"
                               th:disabled="${readOnly}"/>
                        <span class="text-xs text-tertiary">每秒最多迁移字节数，0 表示不限速</span>
                    </div>
                </div>
                <div>
                    <div class="checkbox-group checkbox-group-inline mb-0">
                        <input type="checkbox" name="enableOffPeakWindow" id="dbSyncEnableOffPeakWindow"
                               value="true"
                               th:checked="${task == null ? false : task.enableOffPeakWindow}"
                               th:disabled="${readOnly}"/>
                        <label for="dbSyncEnableOffPeakWindow">仅在低峰时间窗内启动</label>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="form-item mb-0">
                        <label class="form-label" for="dbSyncWindowStart">窗口开始（HH:mm）</label>
                        <div class="form-control-area">
                            <input type="time" name="windowStart" id="dbSyncWindowStart"
                                   class="border border-gray-300 rounded px-2 py-1 text-sm"
                                   th:value="${task == null ? '' : task.windowStart}"
                                   th:disabled="${readOnly}"/>
                        </div>
                    </div>
                    <div class="form-item mb-0">
                        <label class="form-label" for="dbSyncWindowEnd">窗口结束（HH:mm）</label>
                        <div class="form-control-area">
                            <input type="time" name="windowEnd" id="dbSyncWindowEnd"
                                   class="border border-gray-300 rounded px-2 py-1 text-sm"
                                   th:value="${task == null ? '' : task.windowEnd}"
                                   th:disabled="${readOnly}"/>
                        </div>
                    </div>
                </div>
                <div class="col-span-2">
                    <div class="checkbox-group checkbox-group-inline mb-0">
                        <input type="checkbox" name="autoAdvanceStage" id="dbSyncAutoAdvanceStage"
                               value="true"
                               th:checked="${task == null ? false : task.autoAdvanceStage}"
                               th:disabled="${readOnly}"/>
                        <label for="dbSyncAutoAdvanceStage">全量完成后自动推进到增量追平阶段</label>
                    </div>
                    <div>
                        <span class="text-xs text-tertiary">默认关闭；需人工推进到 full 阶段后才会自动升为 increment</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- Wave30：大数据量性能参数（此前只在模型里，页面无法配置、引擎也没读取） -->
        <div class="col-span-2">
            <div class="grid grid-cols-3 gap-4 rounded border border-gray-200 p-4">
                <div class="form-item mb-0">
                    <label class="form-label" for="dbSyncReadNum">分页读取条数</label>
                    <div class="form-control-area">
                        <input type="number" min="100" max="100000" step="100" name="readNum" id="dbSyncReadNum"
                               class="border border-gray-300 rounded px-2 py-1 text-sm"
                               th:value="${task == null or task.readNum <= 0 ? 10000 : task.readNum}"
                               th:disabled="${readOnly}"/>
                        <span class="text-xs text-tertiary">单页读取上限，默认 10000</span>
                    </div>
                </div>
                <div class="form-item mb-0">
                    <label class="form-label" for="dbSyncBatchNum">单次写入条数</label>
                    <div class="form-control-area">
                        <input type="number" min="1" max="10000" step="1" name="batchNum" id="dbSyncBatchNum"
                               class="border border-gray-300 rounded px-2 py-1 text-sm"
                               th:value="${task == null or task.batchNum <= 0 ? 1000 : task.batchNum}"
                               th:disabled="${readOnly}"/>
                        <span class="text-xs text-tertiary">写批拆分粒度，默认 1000</span>
                    </div>
                </div>
                <div class="form-item mb-0">
                    <label class="form-label" for="dbSyncThreadNum">表级并发线程数</label>
                    <div class="form-control-area">
                        <input type="number" min="1" max="32" step="1" name="threadNum" id="dbSyncThreadNum"
                               class="border border-gray-300 rounded px-2 py-1 text-sm"
                               th:value="${task == null or task.threadNum <= 0 ? 5 : task.threadNum}"
                               th:disabled="${readOnly}"/>
                        <span class="text-xs text-tertiary">数据阶段并发表数，默认 5；同时限制单表分片读上限</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
