<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<!-- 超大内容外置（解除 65535 字节截断的非破坏式路径，Wave17 运行时接线） -->
<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">超大内容外置</h3>
    </div>
    <div class="card-body">
        <div class="tip-box mb-3">
            <i class="fa fa-info-circle"></i>
            内容 UTF-8 字节数不超过阈值时原样内联；超限按分块协议外置，返回
            <code>DBDS-REF:&lt;refId&gt;</code> 引用串（可反解还原原文）。
            <br><span class="text-tertiary">不改表结构；块存储默认为进程内存实现，可切换为文件持久化（跨重启恢复）。</span>
        </div>

        <!-- 块存储配置（Wave20） -->
        <h4 class="mb-2 font-medium text-sm"><i class="fa fa-hdd-o text-primary"></i> 块存储配置</h4>
        <div class="grid grid-cols-2 gap-4 mb-3">
            <div>
                <label class="form-label">存储形态</label>
                <select id="storeMode" class="form-input">
                    <option value="memory">memory（进程内存，默认）</option>
                    <option value="file">file（文件持久化，跨重启恢复）</option>
                </select>
            </div>
            <div>
                <label class="form-label">文件存储根目录（file 形态必填）</label>
                <input id="storeRootDir" class="form-input" placeholder="例如：/data/dbdatasync/chunks">
            </div>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary" onclick="doStoreConfig()"><i class="fa fa-check"></i> 应用</button>
            <button class="btn btn-secondary" onclick="doStoreConfigQuery()"><i class="fa fa-refresh"></i> 查看当前形态</button>
        </div>
        <div id="storeCfgResult" style="display:none;" class="mb-4"></div>

        <!-- 存储 -->
        <div class="mb-3">
            <label class="form-label">内容（content）</label>
            <textarea id="contentText" class="form-input" rows="8"
                      placeholder="粘贴任意文本内容（支持中文多字节字符）"
                      style="font-family: Consolas, Menlo, monospace; font-size: 13px;"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-3">
            <div>
                <label class="form-label">内联阈值（字节，可选，默认 65535）</label>
                <input id="maxInline" class="form-input" type="number" placeholder="65535">
            </div>
            <div>
                <label class="form-label">操作</label>
                <div class="flex gap-2">
                    <button class="btn btn-primary" onclick="doStore()"><i class="fa fa-save"></i> 存储</button>
                    <button class="btn btn-secondary" onclick="doResolve()"><i class="fa fa-search"></i> 反解</button>
                    <button class="btn btn-danger" onclick="doDelete()"><i class="fa fa-trash"></i> 删除块</button>
                </div>
            </div>
        </div>

        <!-- 存储值（引用串/原文） -->
        <div class="mb-3">
            <label class="form-label">存储值（引用串或原文，反解/删除用）</label>
            <input id="storedText" class="form-input" placeholder="DBDS-REF:..."
                   style="font-family: Consolas, Menlo, monospace; font-size: 13px;">
        </div>

        <!-- 结果区 -->
        <div id="offloadResult" style="display:none;">
            <div class="mb-2" id="offloadSummary"></div>
            <pre id="offloadOutput" class="text-xs p-2 border rounded bg-surface"
                 style="white-space:pre-wrap;word-break:break-all;font-family:Consolas,Menlo,monospace;max-height:360px;overflow:auto;"></pre>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function showResult(summary, text) {
        document.getElementById('offloadResult').style.display = 'block';
        document.getElementById('offloadSummary').innerHTML = summary;
        document.getElementById('offloadOutput').textContent = text;
    }

    function doStoreConfig() {
        const mode = document.getElementById('storeMode').value;
        const params = { mode: mode };
        if (mode === 'file') {
            const rootDir = document.getElementById('storeRootDir').value.trim();
            if (!rootDir) {
                bootGrowl('file 形态需填写根目录', 'warning');
                return;
            }
            params.rootDir = rootDir;
        }
        doPoster('/content-offload/storeConfig', params, function (response) {
            if (!response.success) {
                bootGrowl(response.message || '配置失败', 'danger');
                return;
            }
            renderStoreCfg(response.data);
            bootGrowl('块存储已切换为 ' + response.data.storeType, 'success');
        });
    }

    function doStoreConfigQuery() {
        doPoster('/content-offload/storeConfig', {}, function (response) {
            if (!response.success) {
                bootGrowl(response.message || '查询失败', 'danger');
                return;
            }
            renderStoreCfg(response.data);
        });
    }

    function renderStoreCfg(d) {
        const box = document.getElementById('storeCfgResult');
        box.style.display = 'block';
        const badge = d.storeType === 'file'
            ? '<span class="badge badge-success">file（持久化）</span>'
            : '<span class="badge badge-info">memory（内存）</span>';
        box.innerHTML = badge
            + ' <span class="text-xs text-tertiary">内联阈值：' + (d.maxInlineBytes || 0) + ' 字节</span>'
            + (d.before ? ' <span class="text-xs text-tertiary">（切换前：' + escapeHtml(d.before) + '）</span>' : '');
    }

    function doStore() {
        const content = document.getElementById('contentText').value;
        if (content === '') {
            bootGrowl('content 不能为空', 'warning');
            return;
        }
        const maxInline = document.getElementById('maxInline').value.trim();
        const params = { content: content };
        if (maxInline) { params.maxInlineBytes = maxInline; }
        doPoster('/content-offload/store', params, function (response) {
            if (!response.success) {
                bootGrowl(response.message || '存储失败', 'danger');
                return;
            }
            const d = response.data || {};
            const stored = d.stored || '';
            document.getElementById('storedText').value = stored;
            const badge = d.offloaded
                ? '<span class="badge badge-warning">已分块外置</span>'
                : '<span class="badge badge-success">内联直通（未超限）</span>';
            showResult(badge + ' <span class="text-xs text-tertiary">UTF-8 字节数：'
                + (d.utf8Bytes || 0) + '</span>', stored);
            bootGrowl(d.offloaded ? '内容已分块外置并返回引用串' : '内容未超限，内联返回', 'success');
        });
    }

    function doResolve() {
        const stored = document.getElementById('storedText').value.trim();
        if (!stored) {
            bootGrowl('请填写存储值（引用串或原文）', 'warning');
            return;
        }
        doPoster('/content-offload/resolve', { stored: stored }, function (response) {
            if (!response.success) {
                bootGrowl(response.message || '反解失败', 'danger');
                return;
            }
            showResult('<span class="badge badge-success">反解成功</span>', String(response.data == null ? '' : response.data));
        });
    }

    function doDelete() {
        const stored = document.getElementById('storedText').value.trim();
        if (!stored) {
            bootGrowl('请填写存储值（引用串或原文）', 'warning');
            return;
        }
        doPoster('/content-offload/delete', { stored: stored }, function (response) {
            if (!response.success) {
                bootGrowl(response.message || '删除失败', 'danger');
                return;
            }
            showResult('<span class="badge badge-info">外置块已删除</span>', '');
            bootGrowl('外置内容已删除', 'info');
        });
    }
</script>
