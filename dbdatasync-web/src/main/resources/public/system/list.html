<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">系统配置</h3>
    </div>
    <div class="card-body">
        <form id="config-form-edit">
            <!-- 管理员操作区域 -->
            <div class="form-actions mb-4">
                <button id="updateSystemBtn" type="button" class="btn btn-primary">
                    <span class="fa fa-save"></span> 保存
                </button>
            </div>
            <div class="grid grid-cols-2">
                <div class="form-item">
                    <label class="form-label">记录同步成功数据</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableStorageWriteSuccess" th:checked="${config?.enableStorageWriteSuccess}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">记录全量数据<i class="fa fa-question-circle"
                                                             title="不推荐在生产环境下开启，可在源库数据量较少时使用，一般用于测试"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableStorageWriteFull" th:checked="${config?.enableStorageWriteFull}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">记录同步失败数据</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableStorageWriteFail" th:checked="${config?.enableStorageWriteFail}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">记录失败日志长度<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1024" max="8192" required
                               name="maxStorageErrorLength" th:value="${config?.maxStorageErrorLength}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">表执行器上限数<i class="fa fa-question-circle"
                                                               title="每新增一张驱动表的映射关系，就会单独新开一个表执行器处理，超过此限制后，则使用通用执行器"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="200" required
                               name="maxBufferActuatorSize" th:value="${config?.maxBufferActuatorSize}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">DDL 同步风险策略<i class="fa fa-question-circle"
                                                               title="all=全部 ALTER 自动同步; add_only=仅新增字段自动同步(改类型/删列/改名拦截需人工确认); off=关闭 DDL 同步"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <select class="form-control" name="ddlSyncPolicy">
                            <option value="all" th:selected="${config?.ddlSyncPolicy == null || config?.ddlSyncPolicy == 'all'}">all - 全部自动同步</option>
                            <option value="add_only" th:selected="${config?.ddlSyncPolicy == 'add_only'}">add_only - 仅新增字段(推荐)</option>
                            <option value="off" th:selected="${config?.ddlSyncPolicy == 'off'}">off - 关闭 DDL 同步</option>
                        </select>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">驱动(同步任务)总数上限<i class="fa fa-question-circle"
                                                               title="允许创建的驱动数量上限，超过后禁止新建/复制驱动，0 表示不限制"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="0" max="10000" required
                               name="maxMappingSize" th:value="${config?.maxMappingSize}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">运行中驱动并发上限<i class="fa fa-question-circle"
                                                               title="同时处于运行状态的驱动数量上限，超过后禁止启动新驱动，0 表示不限制"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="0" max="1000" required
                               name="maxRunningMappingSize" th:value="${config?.maxRunningMappingSize}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">同步数据过期时间(天)<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="180" required name="expireDataDays"
                               th:value="${config?.expireDataDays}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">系统日志过期时间(天)<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="180" required name="expireLogDays"
                               th:value="${config?.expireLogDays}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">日志文件过期时间(天)<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="180" required name="expireFileLogDays"
                               th:value="${config?.expireFileLogDays}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">水印<i class="fa fa-question-circle" title="刷新页面生效"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input id="enableWatermark" name="enableWatermark" th:checked="${config?.enableWatermark}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label watermark hidden">水印内容</label>
                    <div class="form-control-area watermark hidden">
                        <input type="text" class="form-control" maxlength="64" name="watermark"
                               placeholder="请输入水印(最多64个字)." th:value="${config?.watermark}"/>
                    </div>
                </div>
            </div>
            <div class="grid mt-5 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">打印trace信息<i class="fa fa-question-circle"
                                                              title="仅用于排查问题，生产环境建议关闭"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enablePrintTraceInfo" th:checked="${config?.enablePrintTraceInfo}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 开放API配置 -->
            <div class="grid mt-5 grid-cols-1 lg:grid-cols-3">
                <div class="form-item lg:col-span-2">
                    <label class="form-label">开放api<i class="fa fa-question-circle"
                                                        title="外部业务系统可凭此配置生成token，直接调用数据同步工具的管理接口，也可以同步数据。"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableOpenAPI" th:checked="${config?.enableOpenAPI}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item lg:col-span-2">
                    <label class="form-label open-api hidden">API密钥<i class="fa fa-question-circle"
                                                                        title="用于生成token访问OpenAPI，生成后请妥善保管"></i></label>
                    <div class="form-control-area flex">
                        <input type="text" class="form-control open-api hidden" name="apiSecret"
                               th:value="${config?.currentSecret}"/>
                        <div class="form-actions ml-2">
                            <button type="button" class="open-api hidden btn btn-outline" id="copyApiSecretBtn">
                                <i class="fa fa-copy"></i> 复制
                            </button>
                            <button type="button" class="open-api hidden btn btn-outline" id="generateSecret">
                                <span class="fa fa-refresh"></span> 生成
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid mt-5 grid-cols-1 lg:grid-cols-3">
                <div class="form-item lg:col-span-2">
                    <label class="form-label open-api hidden">RSA长度<i class="fa fa-question-circle"
                                                                        title="允许输入的范围[1024,2048,4096,8192]"></i></label>
                    <div class="form-control-area flex">
                        <input type="number" class="form-control open-api hidden" name="rsaKeyLength" min="1024"
                               max="8192" placeholder="允许输入的范围[1024-8192]"
                               th:value="${config?.currentRsa?.keyLength}?: 2048"/>
                        <button id="generateRSA" type="button" class="open-api hidden btn btn-outline ml-2">
                            <span class="fa fa-refresh"></span> 生成
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid mt-5 open-api hidden">
                <div class="form-item">
                    <label class="form-label">RSA公钥</label>
                    <div class="form-control-area">
                        <textarea name="rsaPublicKey" class="form-control" disabled maxlength="8192" rows="5">[[${config?.currentRsa?.publicKey}]]</textarea>
                        <button type="button" class="btn btn-outline mt-1" id="copyPublicKeyBtn">
                            <i class="fa fa-copy"></i> 复制
                        </button>
                    </div>
                </div>

                <div class="form-item">
                    <label class="form-label">RSA私钥</label>
                    <div class="form-control-area">
                        <textarea name="rsaPrivateKey" class="form-control" disabled maxlength="8192" rows="10">[[${config?.currentRsa?.privateKey}]]</textarea>
                        <button type="button" class="btn btn-outline mt-1" id="copyPrivateKeyBtn">
                            <i class="fa fa-copy"></i> 复制
                        </button>
                    </div>
                </div>
            </div>

            <!-- IP白名单 -->
            <div class="grid grid-cols-2 mt-5 open-api hidden">
                <div class="form-item">
                    <label class="form-label">IP白名单<i class="fa fa-question-circle"
                                                         title="开启后仅白名单内IP可访问OpenAPI"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="ipWhitelistEnabled" th:checked="${config?.ipWhitelistConfig?.enabled}"
                                   type="checkbox" value="true"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item ip-whitelist-detail">
                    <label class="form-label">允许本地访问<i class="fa fa-question-circle"
                                                             title="127.0.0.1、localhost等"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="ipWhitelistAllowLocalhost"
                                   th:checked="${config?.ipWhitelistConfig?.allowLocalhost != null ? config.ipWhitelistConfig.allowLocalhost : true}"
                                   type="checkbox" value="true"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item ip-whitelist-detail">
                    <label class="form-label">IP白名单</label>
                    <div class="form-control-area">
                        <textarea name="ipWhitelist" class="form-control" rows="5"
                                  placeholder="每行一个，支持：单个IP、CIDR(192.168.1.0/24)、范围(192.168.1.1-192.168.1.100)">[[${config?.ipWhitelistText}]]</textarea>
                    </div>
                </div>
            </div>

            <!-- 可靠性与链路健康（Wave22） -->
            <div class="grid mt-5 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">写入自动重试<i class="fa fa-question-circle"
                        title="仅对死锁、锁等待、连接闪断、超时等瞬时故障做指数退避重试；主键冲突、类型不符、语法错误等永久故障直接进死信"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableWriteRetry" th:checked="${config?.enableWriteRetry}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">单行最大写入次数</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="10" name="writeRetryMaxAttempts"
                               th:value="${config?.writeRetryMaxAttempts}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">退避基础间隔(ms)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="0" max="2000" name="writeRetryBaseMillis"
                               th:value="${config?.writeRetryBaseMillis}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">单行重试时间预算(ms)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="0" max="30000" name="writeRetryMaxMillis"
                               th:value="${config?.writeRetryMaxMillis}"/>
                    </div>
                </div>
            </div>

            <div class="grid mt-5 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">链路健康告警<i class="fa fa-question-circle"
                        title="链路停滞或失败率超阈值时，通过已配置的告警渠道通知"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableReplicationAlarm" th:checked="${config?.enableReplicationAlarm}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Prometheus 指标</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enablePrometheus" th:checked="${config?.enablePrometheus}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">停滞告警阈值(秒)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="5" max="86400" name="lagWarnSeconds"
                               th:value="${config?.lagWarnSeconds}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">停滞严重阈值(秒)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="10" max="86400" name="lagCriticalSeconds"
                               th:value="${config?.lagCriticalSeconds}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">失败率告警阈值(%)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="100" name="failRateWarnPercent"
                               th:value="${config?.failRateWarnPercent}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">同链路告警冷却(秒)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="30" max="86400" name="healthAlarmCooldownSeconds"
                               th:value="${config?.healthAlarmCooldownSeconds}"/>
                    </div>
                </div>
            </div>

            <!-- 架构级能力（Wave23） -->
            <div class="grid mt-5 grid-cols-1">
                <div class="form-item">
                    <h4 class="form-label" style="font-size:14px;font-weight:700;color:var(--primary-color);margin-bottom:2px">
                        <i class="fa fa-cubes"></i> 架构级能力（Wave23）
                    </h4>
                    <p style="font-size:12px;color:var(--text-tertiary);margin:0">
                        以下能力默认关闭，保存后即时生效；生产启用前请确认对应目录可被所有节点访问。
                    </p>
                </div>
            </div>
            <div class="grid mt-2 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">事务型 checkpoint<i class="fa fa-question-circle"
                        title="开启后在真实增量链路上计算幂等键，写入成功才提交位点；重复事件直接丢弃，向 exactly-once 收敛。需目标端主键/唯一键 upsert 配合"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableTransactionalCheckpoint" th:checked="${config?.enableTransactionalCheckpoint}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">checkpoint 目录<i class="fa fa-question-circle"
                        title="位点文件与幂等账本目录；多节点部署时需为共享存储"></i></label>
                    <div class="form-control-area">
                        <input type="text" class="form-control" name="checkpointDir" maxlength="256"
                               th:value="${config?.checkpointDir}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">幂等账本上限(条)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1000" max="2000000" name="checkpointMaxKeys"
                               th:value="${config?.checkpointMaxKeys}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">无主键表退化支持<i class="fa fa-question-circle"
                        title="缺主键时优先使用唯一索引列作为 WHERE 键；缺唯一索引时只做全行哈希识别，不伪装成目标端列"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableNoPkFallback" th:checked="${config?.enableNoPkFallback}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="grid mt-4 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">集群 HA<i class="fa fa-question-circle"
                        title="开启后任务启动需取得 leader + 任务独占租约，关闭任务释放租约，并周期接管过期租约的真实任务"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableClusterHA" th:checked="${config?.enableClusterHA}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">集群租约目录<i class="fa fa-question-circle"
                        title="文件租约目录，多节点必须指向同一 NFS/共享盘；非共享存储不提供 HA 保证"></i></label>
                    <div class="form-control-area">
                        <input type="text" class="form-control" name="clusterLeaseDir" maxlength="256"
                               th:value="${config?.clusterLeaseDir}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">死信自动重放<i class="fa fa-question-circle"
                        title="每分钟扫描带失败标签的明细，指数退避重放；只有写入结果明确成功才删除明细，避免二次丢数据"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableDeadLetterAutoReplay" th:checked="${config?.enableDeadLetterAutoReplay}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">重放次数上限</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="10" name="deadLetterReplayMaxAttempts"
                               th:value="${config?.deadLetterReplayMaxAttempts}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">重放退避基础(ms)</label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="50" max="60000" name="deadLetterReplayBaseMillis"
                               th:value="${config?.deadLetterReplayBaseMillis}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">严格安全模式<i class="fa fa-question-circle"
                        title="开启后 /actuator/**、/system/**、/user/** 仅 admin 角色可访问；默认关闭以兼容存量部署"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableStrictSecurity" th:checked="${config?.enableStrictSecurity}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="panel-section mt-4">
                <div class="section-heading">
                    <h3>Wave24 · 一致性与结构变更</h3>
                    <p>目标库事务内位点、DDL schema history 与自动切流均默认关闭；启用前请按操作手册第 19 章完成前置准备。</p>
                </div>
            </div>
            <div class="grid mt-2 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">目标库事务内位点<i class="fa fa-question-circle"
                        title="把 checkpoint 写入目标库同一 JDBC 事务（__DBSYNC_CHECKPOINT 表），数据与位点原子提交；需先建表且同时开启事务型 checkpoint"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableCheckpointInTargetTx" th:checked="${config?.enableCheckpointInTargetTx}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">表级 DDL 自动同步<i class="fa fa-question-circle"
                        title="开启后非高风险表级 DDL 自动写目标端；DROP/TRUNCATE/RENAME 等仍必须人工确认"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableDdlAutoSync" th:checked="${config?.enableDdlAutoSync}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">DDL-DML 顺序守卫<i class="fa fa-question-circle"
                        title="表级 DDL 未确认时挂起同表 DML，确认应用后按原顺序重放，避免按旧 schema 写入"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableDdlDmlOrderGuard" th:checked="${config?.enableDdlDmlOrderGuard}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">schema history 目录<i class="fa fa-question-circle"
                        title="DDL 历史 JSONL 落盘目录；单实例可用本地盘，多节点建议共享存储"></i></label>
                    <div class="form-control-area">
                        <input type="text" class="form-control" name="schemaHistoryDir" maxlength="256"
                               th:value="${config?.schemaHistoryDir}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">自动切流 / 真实回滚<i class="fa fa-question-circle"
                        title="相位推进成功后调用真实执行器；未接入外部动作处理器时结果标记 simulated，不冒充已切流"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableCutoverAutoExecute" th:checked="${config?.enableCutoverAutoExecute}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

        </form>
        <div class="blank-block-md"></div>

    </div>
</div>

<script>
    $(function () {
        const watermark = $('.watermark');
        const openApiItems = $(".open-api");
        const rsaKeyLength = $("input[name='rsaKeyLength']");
        const apiSecret = $("input[name='apiSecret']");
        const rsaPublicKey = $("textarea[name='rsaPublicKey']");
        const rsaPrivateKey = $("textarea[name='rsaPrivateKey']");
        const generateSecretBtn = $("#generateSecret");
        const generateRSABtn = $("#generateRSA");
        const copyApiSecretBtn = $("#copyApiSecretBtn");
        const copyPublicKeyBtn = $("#copyPublicKeyBtn");
        const copyPrivateKeyBtn = $("#copyPrivateKeyBtn");

        function toggleWatermark(checked) {
            if (checked) {
                watermark.show();
            } else {
                watermark.hide();
            }
        }

        let switchApi = initSwitch($('#enableWatermark'), toggleWatermark);
        toggleWatermark(switchApi.isChecked());

        //保存
        $("#updateSystemBtn").click(function () {
            const $form = $("#config-form-edit");
            if (validateForm($form)) {
                // 允许修改参数
                rsaPublicKey.prop('disabled', false);
                rsaPrivateKey.prop('disabled', false);
                const submitBtn = $(this);
                const originalText = submitBtn.html();
                submitBtn.html('<i class="fa fa-spinner fa-spin"></i> 保存中...').prop('disabled', true);
                doPoster('/system/edit', $form.serializeJson(), function (response) {
                    submitBtn.html(originalText).prop('disabled', false);
                    if (response.success === true) {
                        bootGrowl("修改成功!", "success");
                        doLoader("/system");
                    } else {
                        bootGrowl(response.message, "danger");
                    }
                });
            }
        });

        generateRSABtn.click(function () {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> 生成中...').prop('disabled', true);
            doPoster('/system/generateRSA', {'keyLength': rsaKeyLength.val()}, function (response) {
                btn.html(originalText).prop('disabled', false);
                if (response.success === true) {
                    rsaPublicKey.text(response.data.publicKey);
                    rsaPrivateKey.text(response.data.privateKey);
                    bootGrowl("生成RSA成功!", "success");
                } else {
                    bootGrowl(response.message, "danger");
                }
            });
        });

        // 生成 API 密钥（OpenAPI 登录凭证）
        generateSecretBtn.click(function () {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> 生成中...').prop('disabled', true);
            doPoster('/system/generateApiSecret', {}, function (response) {
                btn.html(originalText).prop('disabled', false);
                if (response.success === true && response.data) {
                    const secret = response.data;
                    apiSecret.val(secret);
                    bootGrowl("生成API密钥成功!", "success");
                } else {
                    bootGrowl(response.message || "danger");
                }
            });
        });

        function bindCopyBtn(btn, element, content) {
            // 先移除旧的事件绑定，避免重复绑定
            btn.off('click');
            btn.on('click', function () {
                const text = element.val();
                if (isBlank(text)) {
                    bootGrowl(content + "为空，无法复制", "warning");
                    return;
                }
                copyToClipboard(text, {
                    button: $(this),
                    successMessage: "复制" + content + "成功！",
                    originalText: "复制",
                    originalIcon: "fa-copy"
                });
            });
        }

        // 绑定复制按钮事件
        function bindCopyButtons() {
            bindCopyBtn(copyApiSecretBtn, apiSecret, "API密钥");
            bindCopyBtn(copyPublicKeyBtn, rsaPublicKey, "RSA公钥");
            bindCopyBtn(copyPrivateKeyBtn, rsaPrivateKey, "RSA私钥");
        }

        const ipWhitelistDetail = $(".ip-whitelist-detail");

        function toggleIpWhitelistDetail(checked) {
            if (checked) {
                ipWhitelistDetail.show();
            } else {
                ipWhitelistDetail.hide();
            }
        }

        let ipWhitelistSwitch = initSwitch($("input[name='ipWhitelistEnabled']"), toggleIpWhitelistDetail);

        function toggleOpenApiItem(checked) {
            rsaKeyLength.prop('disabled', !checked);
            generateRSABtn.prop('disabled', !checked);
            if (checked) {
                openApiItems.show();
                toggleIpWhitelistDetail(ipWhitelistSwitch.isChecked());
                // 显示区域后，延迟绑定事件，确保 DOM 元素已渲染
                setTimeout(function () {
                    bindCopyButtons();
                }, 100);
                if (isBlank(apiSecret.val())) {
                    generateSecretBtn.click();
                }
                if (isBlank(rsaPublicKey.val()) && isBlank(rsaPrivateKey.val())) {
                    generateRSABtn.click();
                }
                return;
            }
            openApiItems.hide();
        }

        let enableOpenAPI = initSwitch($("input[name='enableOpenAPI']"), toggleOpenApiItem);
        const enableOpenAPIChecked = enableOpenAPI.isChecked();
        toggleOpenApiItem(enableOpenAPIChecked);
        // 如果初始状态就是显示 RSA 配置，也需要绑定事件
        if (enableOpenAPIChecked) {
            setTimeout(function () {
                bindCopyButtons();
            }, 100);
        }

        // 初始根据 IP白名单 开关显示/隐藏「允许本地访问」和「IP白名单」输入框
        toggleIpWhitelistDetail(ipWhitelistSwitch.isChecked());
    })
</script>
</html>
