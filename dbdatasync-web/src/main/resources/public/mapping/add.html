<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">添加数据同步</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4">
            <button id="mappingSubmitBtn" class="btn btn-primary">
                <i class="fa fa-save"></i> 保存
            </button>
            <button class="btn btn-outline" onclick="backIndexPage()">
                <i class="fa fa-reply"></i> 返回
            </button>
        </div>

        <form id="mappingAddForm">
            <!-- 数据源和目标源 -->
            <div class="grid grid-cols-2">
                <!-- 数据源 -->
                <div class="form-item">
                    <label class="form-label">
                        <i class="fa fa-database text-primary"></i> 数据源<strong class="text-primary">*</strong>
                    </label>
                    <select name="sourceConnectorId" id="sourceConnectorId" class="form-control"></select>
                </div>

                <!-- 目标源 -->
                <div class="form-item">
                    <label class="form-label">
                        <i class="fa fa-database text-success"></i> 目标源<strong class="text-primary">*</strong>
                    </label>
                    <select name="targetConnectorId" id="targetConnectorId" class="form-control"></select>
                </div>
            </div>

            <!-- 数据库配置 -->
            <div class="grid grid-cols-2 mt-5">
                <div class="form-item">
                    <label class="form-label">源库</label>
                    <select name="sourceDatabase" id="sourceDatabase" class="form-control"></select>
                </div>
                <div class="form-item">
                    <label class="form-label">目标库</label>
                    <select name="targetDatabase" id="targetDatabase" class="form-control"></select>
                </div>
            </div>

            <!-- Schema配置 -->
            <div class="grid grid-cols-2 mt-5">
                <div class="form-item">
                    <label class="form-label">源Schema</label>
                    <select name="sourceSchema" id="sourceSchema" class="form-control"></select>
                </div>
                <div class="form-item">
                    <label class="form-label">目标Schema</label>
                    <select name="targetSchema" id="targetSchema" class="form-control"></select>
                </div>
            </div>

            <!-- 驱动名称和匹配相似表 -->
            <div class="grid grid-cols-2 mt-5">
                <div class="form-item">
                    <label class="form-label">名称<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input class="form-control" name="name" type="text" maxlength="50" required placeholder="请输入任务名称"/>
                    </div>
                </div>

                <div class="form-item">
                    <label class="form-label"><i class="fa fa-table text-info"></i> 匹配相似表</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="autoMatchTable" type="checkbox" />
                            <span class="switch-track">
                                    <span class="switch-option switch-option-on">Yes</span>
                                    <span class="switch-option switch-option-off">No</span>
                                    <span class="switch-thumb"></span>
                                </span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 表映射关系 -->
            <div class="grid mt-5">
                <div class="form-item" id="tableGroups">
                    <label class="form-label">
                        表映射关系
                        <i class="fa fa-question-circle" title="适用于快速配置大量表映射关系场景"></i>
                    </label>
                    <div>
                        <textarea name="tableGroups" class="form-control" rows="10" placeholder="请输入表映射关系，每行一个映射..."></textarea>
                        <label class="text-gray-500">
                            <span class="text-sm">数据源表|目标源表=源表字段A1*|目标字段A2*,源表字段B1|目标字段B2</span>
                            <i class="fa fa-question-circle" title="'|'表示表映射关系，'='表示后面是字段映射关系，多个字段使用英文','拼接，'*'表示主键，多张表请换行追加"></i>
                        </label>
                    </div>
                </div>

            </div>

            <!-- 同步方式（实时同步 / 批量异步） -->
            <div class="grid grid-cols-2 mt-5">
                <div class="form-item">
                    <label class="form-label">
                        <i class="fa fa-cogs text-primary"></i> 同步方式
                        <i class="fa fa-question-circle" title="实时同步 SYNC：单线程顺序写入，强一致，实时性优先（适合 binlog 增量或频繁小批量场景，类似 DataX 实时流模式）；批量异步 ASYNC：多线程并发写入，吞吐优先（适合全量数据迁移或时间戳增量场景，类似 DataX 离线批量模式）"></i>
                    </label>
                    <div class="form-control-area">
                        <div class="sync-mode-tabs" role="tablist">
                            <input type="radio" name="syncMode" id="syncModeSync" value="SYNC" checked />
                            <label for="syncModeSync" class="sync-mode-tab sync-mode-tab-success">
                                <i class="fa fa-bolt"></i> 实时同步 SYNC
                                <span class="sync-mode-tip">单线程 · 强一致 · 实时优先</span>
                                <span class="sync-mode-desc">类似 DataX 实时流模式</span>
                            </label>
                            <input type="radio" name="syncMode" id="syncModeAsync" value="ASYNC" />
                            <label for="syncModeAsync" class="sync-mode-tab sync-mode-tab-warning">
                                <i class="fa fa-rocket"></i> 批量异步 ASYNC
                                <span class="sync-mode-tip">多线程 · 高吞吐 · 并发写入</span>
                                <span class="sync-mode-desc">类似 DataX 离线批量模式</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-item flex items-end">
                    <div class="text-sm text-gray-500 sync-mode-hints">
                        <i class="fa fa-info-circle text-primary"></i> 实时同步建议配合 <b>binlog 增量</b> 使用，源端变更后立即同步到目标；<br/>
                        批量异步适合 <b>全量数据迁移</b> 或 <b>时间戳增量</b>，并发写入吞吐更高。<br/>
                        <span class="text-muted text-xs">注：异步模式仅在批次大小（batchNum）&lt; 单批读取数（readNum）时并发拆分生效。</span>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    function resolveConnectorType($connector, connectorId) {
        const fromSelect = typeof resolveConnectorTypeFromSelect === 'function'
            ? resolveConnectorTypeFromSelect($connector, connectorId) : '';
        if (fromSelect) {
            return fromSelect;
        }
        if (!$connector || !connectorId) {
            return '';
        }
        const $option = $connector.find('option[value="' + connectorId + '"]');
        if (!$option.length) {
            return '';
        }
        const text = $option.text() || '';
        const match = text.match(/\(([^()]+)\)\s*$/);
        return match && match[1] ? match[1].trim() : '';
    }

    function isOracleConnector($connector, connectorId) {
        const type = resolveConnectorType($connector, connectorId);
        // 达梦 / OceanBaseOracle 与 Oracle 一样以 Schema(用户) 为命名空间，无独立库列表
        return type && ['oracle', 'dameng', 'oceanbaseoracle'].indexOf(String(type).toLowerCase()) >= 0;
    }

    function toggleDatabaseFieldVisibility($database, hide) {
        $database.closest('.form-item').toggleClass('hidden', !!hide);
    }

    function onDBChange(connectorId, schemaSelect, dbName, oracleMode) {
        schemaSelect.setData([]);
        schemaSelect.setValues([], true);
        if (!connectorId) {
            return;
        }
        if (!oracleMode && !dbName) {
            return;
        }
        doGetter('/connector/getSchema', {id: connectorId, database: dbName || ''}, function (response) {
            if (response.success) {
                const schemas = response.data || [];
                const array = schemas.map(function (schema) {
                    return {label: schema, value: schema, disabled: false};
                });
                schemaSelect.setData(array);
            } else {
                bootGrowl("获取Schema信息失败: " + response.message, "danger");
            }
        });
    }

    function onConnectorChange(connectorId, dbSelect, schemaSelect, $connector, $database) {
        const oracleMode = isOracleConnector($connector, connectorId);
        toggleDatabaseFieldVisibility($database, oracleMode);

        dbSelect.setData([]);
        dbSelect.setValues([], true);
        schemaSelect.setData([]);
        schemaSelect.setValues([], true);
        if (!connectorId) {
            return;
        }
        if (oracleMode) {
            onDBChange(connectorId, schemaSelect, '', true);
            return;
        }
        doGetter('/connector/getDatabase', {id: connectorId}, function (response) {
            if (response.success) {
                const databases = response.data || [];
                const db = databases.map(function (dbName) {
                    return {label: dbName, value: dbName, disabled: false};
                });
                dbSelect.setData(db);
            } else {
                bootGrowl("获取数据库信息失败: " + response.message, "danger");
            }
        });
    }

    function initDBSelect($connector, $database, $schema, role) {
        // 为每个 select 组维护独立的连接器ID，避免上下文串用
        let currentConnectorId = null;

        const schemaSelect = $schema.dbSelect({});
        const dbSelect = $database.dbSelect({
            type: 'single',
            onSelect: function (selected) {
                if (currentConnectorId) {
                    onDBChange(currentConnectorId, schemaSelect, selected.length >= 1 ? selected[0] : '', false);
                }
            }
        });
        const connectorSelect = $connector.dbSelect(buildRemoteConnectorSelectOptions({
            role: role,
            onSelect: function (connectorId) {
                currentConnectorId = connectorId.length >= 1 ? connectorId[0] : '';
                onConnectorChange(currentConnectorId, dbSelect, schemaSelect, $connector, $database);
            }
        }));

        // 初始化：如果有默认选中的连接器，加载库列表
        const selected = connectorSelect.getValues();
        if (selected.length >= 1) {
            currentConnectorId = selected[0];
            onConnectorChange(currentConnectorId, dbSelect, schemaSelect, $connector, $database);
        }
    }

    $(document).ready(function() {
        initDBSelect($('#sourceConnectorId'), $('#sourceDatabase'), $('#sourceSchema'), 'source');
        initDBSelect($('#targetConnectorId'), $('#targetDatabase'), $('#targetSchema'), 'target');

        //保存
        $("#mappingSubmitBtn").click(function () {
            const $form = $("#mappingAddForm");
            // 把执行模式合并到 params JSON 中
            var $paramsInput = $('#mappingParams');
            var paramsStr = $paramsInput.val() || '{}';
            var paramsObj;
            try { paramsObj = JSON.parse(paramsStr); } catch (e) { paramsObj = {}; }
            var syncMode = ($form.find('input[name="syncMode"]:checked').val() || 'SYNC').toUpperCase();
            paramsObj.syncMode = (syncMode === 'ASYNC') ? 'ASYNC' : 'SYNC';
            $paramsInput.val(JSON.stringify(paramsObj));

            if (validateForm($form)) {
                const btn = $(this);
                const originalText = btn.html();
                btn.html('<i class="fa fa-spinner fa-spin"></i> 保存中...').prop('disabled', true);
                doPoster("/mapping/add", $form.serializeJson(), function (response) {
                    btn.html(originalText).prop('disabled', false);
                    if (response.success === true) {
                        bootGrowl("保存同步任务成功!", "success");
                        const rawStr = localStorage.getItem("dbdatasync.pagination.mapping-list");
                        const raw = JSON.parse(rawStr);
                        raw.pageNum = 1;
                        localStorage.setItem('dbdatasync.pagination.mapping-list', JSON.stringify(raw));
                        doLoader('/mapping/list');
                    } else {
                        bootGrowl(response.message, "danger");
                    }
                });
            }
        });
    })
</script>
</html>
