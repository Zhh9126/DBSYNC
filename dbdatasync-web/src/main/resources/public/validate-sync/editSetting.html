<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div th:fragment="content" id="validate_sync_advanced_setting">
    <div class="grid grid-cols-4">
        <div class="form-item">
            <label class="form-label">
                批量读取 <strong class="text-primary">*</strong>
            </label>
            <div class="form-control-area">
                <input type="number" name="readNum" class="form-control" min="1" max="200000" required
                       placeholder="1-200000"
                       th:value="${task != null and task.readNum > 0 ? task.readNum : 10000}" />
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">
                单次写入 <strong class="text-primary">*</strong>
            </label>
            <div class="form-control-area">
                <input type="number" name="batchNum" class="form-control" min="1" max="20000" required
                       placeholder="1-20000"
                       th:value="${task != null and task.batchNum > 0 ? task.batchNum : 1000}" />
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">
                单表线程数 <strong class="text-primary">*</strong>
            </label>
            <div class="form-control-area">
                <input type="number" name="threadNum" class="form-control" min="1" max="64" required
                       placeholder="1-64"
                       th:value="${task != null and task.threadNum > 0 ? task.threadNum : 10}" />
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">
                分片并发数
                <i class="fa fa-question-circle" title="full 模式单列主键时按主键值域分片并发校验; 0 或 1 = 串行"></i>
            </label>
            <div class="form-control-area">
                <input type="number" name="fullSplitCount" class="form-control" min="0" max="1024"
                       placeholder="0-1024"
                       th:value="${task != null and task.fullSplitCount != null ? task.fullSplitCount : '0'}" />
                <span class="text-xs text-gray-500">0 或 1 = 串行</span>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 mt-3">
        <div class="form-item">
            <label class="form-label">对比模式
                <i class="fa fa-question-circle" title="full=全量逐行对比(精确定位差异); sample=抽样对比(大表快速健康检查); health=快速体检(count+主键值域, 秒级粗检不订正); checksum=字段级指纹比对(分块 MD5 摘要, 纯定位不订正)"></i>
            </label>
            <div class="form-control-area">
                <select class="form-control" name="compareMode">
                    <option value="full" th:selected="${task == null or task.compareMode == null or task.compareMode == 'full'}">全量逐行对比(推荐)</option>
                    <option value="sample" th:selected="${task != null and task.compareMode == 'sample'}">抽样对比(大表快速检查)</option>
                    <option value="health" th:selected="${task != null and task.compareMode == 'health'}">快速体检(count+主键值域)</option>
                    <option value="checksum" th:selected="${task != null and task.compareMode == 'checksum'}">字段级指纹(分块 MD5 摘要)</option>
                </select>
            </div>
        </div>
    </div>
</div>
</html>
