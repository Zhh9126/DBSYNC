# 自定义 SQL 兼容度扫描规则示例（默认不加载！）
#
# 启用方式：
#   1. 复制本文件为 sqlscan-custom-rules.properties（去掉 .example）
#   2. JVM 增加参数：-Ddbdatasync.sqlscan.custom.rules=sqlscan-custom-rules.properties
#      （值为 classpath 资源路径；也支持文件系统路径的 .properties / .json）
#
# 格式：custom.<序号>.<字段>，序号任意；字段：
#   code / category(function|operator|clause|type) / element / level(error|warn|info)
#   / message / suggestion
#   function 可额外用 pair 限定函数族（如 oracle→mysql）；不填 pair 表示对所有函数族全局生效。
# 校验：必填字段任一为空、level/category 非法时跳过该条并 warn，其余保留；
#       element 统一归一化为小写，level 归一化为小写。
# 未配置 / 文件不存在 / 解析失败时一律降级为仅预置规则，扫描结果与 Wave5/Wave8 完全一致。

# 1) 函数族，限定 oracle→mysql（element 会统一归一化为小写）
custom.1.code=SQL-X01
custom.1.category=function
custom.1.element=my_custom_fn
custom.1.pair=oracle→mysql
custom.1.level=warn
custom.1.message=示例：自定义函数 my_custom_fn 在目标库无等价实现
custom.1.suggestion=改写为 COALESCE(expr, default) 或业务侧实现

# 2) 类型族（全局生效）
custom.2.code=SQL-X02
custom.2.category=type
custom.2.element=my_json_type
custom.2.level=info
custom.2.message=示例：自定义类型 my_json_type 跨库语义需核对
custom.2.suggestion=核对目标库 JSON 类型支持，必要时改 TEXT

# 3) 结构族（全局生效）
custom.3.code=SQL-X03
custom.3.category=clause
custom.3.element=my_custom_clause
custom.3.level=warn
custom.3.message=示例：自定义结构 my_custom_clause 需人工确认
custom.3.suggestion=拆分为标准 SQL 子句
